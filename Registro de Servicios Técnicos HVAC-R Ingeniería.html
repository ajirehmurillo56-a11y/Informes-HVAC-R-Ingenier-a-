<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Servicios Técnicos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--text:#1d2128;--head:#1d2128;--card:#fff;--field:#fbfdfe;--ink:#1d2128;--frost:#eef3f7;--steel:#5b7a8c;--teal:#1a73b8;--line:#c9d8e0;--accent:#d9262c;--ok:#1f8a4c;--bad:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--frost)}
html{-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#e6edf3;--head:#0e1318;--card:#1b2129;--field:#141a21;--frost:#12161b;--line:#33404d;--steel:#97a9b8;--teal:#2d7fc2;--accent:#d9262c;}}
:root[data-theme="dark"]{--text:#e6edf3;--head:#0e1318;--card:#1b2129;--field:#141a21;--frost:#12161b;--line:#33404d;--steel:#97a9b8;--teal:#2d7fc2;--accent:#d9262c;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--frost);color:var(--text);line-height:1.45;padding:0 0 40px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header{background:var(--head);color:#fff;padding:18px 0 16px;margin-bottom:16px}
header .wrap{display:flex;align-items:center;gap:14px}
#logoBox{width:96px;height:96px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;cursor:pointer;border:2px dashed var(--steel);font-size:.7rem;color:var(--steel);text-align:center;padding:4px}
#logoBox img{max-width:100%;max-height:100%;object-fit:contain}
header h1{font-size:1.25rem;line-height:1.2}
header p{font-size:.85rem;color:#c5d3df}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin-bottom:12px}
label.f{display:block;font-weight:600;font-size:.85rem;margin:12px 0 4px}
label.f:first-of-type{margin-top:0}
input[type=text],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--field);color:var(--text)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,.seg label:focus-within{outline:3px solid #8db9dd;outline-offset:1px}
input[readonly]{background:var(--frost);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:11px;text-align:center;font-weight:600;cursor:pointer;background:var(--field)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.on{background:var(--teal);border-color:var(--teal);color:#fff}
.link{background:none;border:0;color:var(--teal);font:inherit;font-size:.85rem;font-weight:600;padding:8px 0;cursor:pointer;text-decoration:underline}
#clientesBox{display:none;margin-top:6px}
#clientesBox small{display:block;color:var(--steel);margin:4px 0 8px}
.fase{border-left:4px solid var(--teal);padding-left:12px;margin-bottom:18px}
.fase h3{font-size:.95rem;margin-bottom:8px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot .pv{aspect-ratio:4/3;background:var(--frost);border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.8rem;color:var(--steel)}
.slot .pv img{width:100%;height:100%;object-fit:cover}
.slot .acc{display:flex;gap:6px;margin-top:6px}
.slot .acc label,.slot .acc button{flex:1;text-align:center;padding:9px 6px;border-radius:8px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid var(--teal);color:var(--teal);background:var(--card)}
.slot .acc button{flex:none;border-color:var(--line);color:var(--steel)}
.slot input[type=file]{display:none}
.btn{width:100%;padding:15px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:8px;background:var(--accent);color:#fff}
.btn.alt{background:var(--ok)}
.btn:disabled{opacity:.6}
#status{display:none;padding:11px;border-radius:8px;margin-bottom:10px;font-size:.9rem;text-align:center}
#status.info{display:block;background:#dce9f5;color:#12457a}
#status.ok{display:block;background:#dcf2e4;color:#14502d}
#status.err{display:block;background:#f8dedc;color:var(--bad)}
footer{text-align:center;color:var(--steel);font-size:.75rem;padding:6px 14px}
</style>
</head>
<body>
<header><div class="wrap">
  <div id="logoBox" role="button" tabindex="0" title="Toca para cambiar el logo">Logo</div>
  <div><h1 id="empresaTxt"></h1><p>Registro de servicios técnicos · <span id="fechaTxt"></span></p></div>
  <input type="file" id="logoInput" accept="image/*" hidden>
</div></header>

<div class="wrap">
<section>
  <h2>Datos del servicio</h2>
  <label class="f" for="tecnico">Técnico *</label>
  <input type="text" id="tecnico" placeholder="Nombre completo" autocomplete="name">
  <label class="f" for="cliente">Cliente *</label>
  <input type="text" id="cliente" list="listaClientes" placeholder="Elige o escribe el cliente" autocomplete="off">
  <datalist id="listaClientes"></datalist>
  <button type="button" class="link" id="editarClientes">Editar lista de clientes</button>
  <div id="clientesBox">
    <small>Un cliente por línea. Se guarda en este celular.</small>
    <textarea id="clientesTxt" placeholder="Cliente 1&#10;Cliente 2"></textarea>
    <button type="button" class="btn" id="guardarClientes" style="background:var(--teal)">Guardar clientes</button>
  </div>
  <label class="f" for="ciudad">Ciudad *</label>
  <input type="text" id="ciudad" placeholder="Ej: Cali">
  <label class="f" for="area">Área / ubicación *</label>
  <input type="text" id="area" placeholder="Ej: Cuarto frío, oficina principal">
  <label class="f">Tipo de servicio *</label>
  <div class="seg" id="seg">
    <label><input type="radio" name="tipo" value="Preventivo">Preventivo</label>
    <label><input type="radio" name="tipo" value="Correctivo">Correctivo</label>
    <label><input type="radio" name="tipo" value="Instalación">Instalación</label>
    <label><input type="radio" name="tipo" value="Diagnóstico">Diagnóstico</label>
  </div>
  <label class="f" for="obs">Observaciones</label>
  <textarea id="obs" placeholder="Trabajo realizado, novedades, recomendaciones"></textarea>
</section>

<section>
  <h2>Registro fotográfico</h2>
  <div id="fases"></div>
</section>

<div id="status" role="status"></div>
<button class="btn" id="btnPdf">Generar reporte PDF</button>
<button class="btn alt" id="btnWa">Enviar por WhatsApp</button>
</div>
<footer id="pie"></footer>

}

// Reduce la foto para que el PDF no pese demasiado
function procesarImagen(file, max, fmt){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        if(fmt === 'JPEG'){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img, 0, 0, w, h);
        res({d: c.toDataURL(fmt === 'PNG' ? 'image/png' : 'image/jpeg', .8), w, h, fmt});
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// Logo
function pintarLogo(){
  const b = $('logoBox');
  if(logo){ b.style.border = '0'; b.style.padding = '4px'; b.innerHTML = '<img alt="Logo" src="' + logo.d + '">'; }
}
try{ const g = store.get('logo'); if(g){ logo = JSON.parse(g); } }catch(e){}
pintarLogo();
$('logoBox').addEventListener('click', () => $('logoInput').click());
$('logoBox').addEventListener('keydown', e => { if(e.key === 'Enter') $('logoInput').click(); });
$('logoInput').addEventListener('change', async e => {
  if(!e.target.files[0]) return;
  try{
    logo = await procesarImagen(e.target.files[0], 400, 'PNG');
    store.set('logo', JSON.stringify(logo));
    pintarLogo();
  }catch(err){ status('No se pudo cargar el logo. Prueba con otra imagen.', 'err'); }
});

// Clientes
function cargarClientes(){
  const lista = (store.get('clientes') || '').split('\n').map(s => s.trim()).filter(Boolean);
  $('listaClientes').innerHTML = lista.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '">').join('');
  $('clientesTxt').value = lista.join('\n');
}
cargarClientes();
$('editarClientes').addEventListener('click', () => {
  const b = $('clientesBox'); b.style.display = b.style.display === 'block' ? 'none' : 'block';
});
$('guardarClientes').addEventListener('click', () => {
  store.set('clientes', $('clientesTxt').value);
  cargarClientes();
  $('clientesBox').style.display = 'none';
  status('Lista de clientes guardada', 'ok');
});

      fotos[k][n-1] = f;
      $('pv-' + k + n).innerHTML = '<img alt="" src="' + f.d + '">';
    }catch(err){ status('No se pudo cargar la foto. Intenta de nuevo.', 'err'); }
  });
}));
document.querySelectorAll('.slot button').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.k, n = b.dataset.n;
  fotos[k][n-1] = null;
  $('pv-' + k + n).textContent = 'Sin foto';
  $('in-' + k + n).value = '';
}));

// Datos y validación
function datos(){
  const t = document.querySelector('input[name=tipo]:checked');
  return {
    tecnico: $('tecnico').value.trim(), cliente: $('cliente').value.trim(),
    ciudad: $('ciudad').value.trim(), area: $('area').value.trim(),
    tipo: t ? t.value : '', obs: $('obs').value.trim()
  };
}
function validar(d){
  if(!d.tecnico) return 'Escribe el nombre del técnico.';
  if(!d.cliente) return 'Elige o escribe el cliente.';
  if(!d.ciudad) return 'Escribe la ciudad.';
  if(!d.area) return 'Escribe el área o ubicación.';
  if(!d.tipo) return 'Elige el tipo de servicio.';
  return '';
}
function nombreArchivo(d){
  const l = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
  const f = new Date(), p = n => String(n).padStart(2,'0');
  return [l(d.cliente), l(d.ciudad), l(d.area), l(d.tipo), f.getFullYear() + p(f.getMonth()+1) + p(f.getDate())].join('_') + '.pdf';
}

// PDF
function crearPDF(d){
  const pdf = new jspdf.jsPDF('p','mm','a4');
  let y = 18;
  if(logo){
    const h = 24, w = Math.min(45, h * logo.w / logo.h), hh = w * logo.h / logo.w;
    pdf.addImage(logo.d, logo.fmt, 15, 10, w, hh);
  }
  pdf.setFontSize(16); pdf.setTextColor(29,33,40); pdf.setFont('helvetica','bold');
  pdf.text(EMPRESA, 195, y, {align:'right'});
  pdf.setFontSize(10); pdf.setFont('helvetica','normal'); pdf.setTextColor(91,122,140);
  pdf.text('REPORTE DE SERVICIO TÉCNICO', 195, y + 6, {align:'right'});
  y += 22;
  pdf.setDrawColor(26,115,184); pdf.setLineWidth(.6); pdf.line(15, y, 195, y);
  y += 9;

  pdf.setFontSize(10); pdf.setTextColor(0,0,0);
  [['Fecha', hoy],['Técnico', d.tecnico],['Cliente', d.cliente],['Ciudad', d.ciudad],
   ['Área / ubicación', d.area],['Tipo de servicio', d.tipo],['Observaciones', d.obs || 'Ninguna']
  ].forEach(([k, v]) => {
    pdf.setFont('helvetica','bold'); pdf.text(k + ':', 15, y);
    pdf.setFont('helvetica','normal');
    const lines = pdf.splitTextToSize(v, 135);
    pdf.text(lines, 55, y);
    y += Math.max(1, lines.length) * 5.5 + 1.5;
    if(y > 262){ pdf.addPage(); y = 20; }
  });

  y += 6;
  if(y > 150){ pdf.addPage(); y = 20; }
  pdf.setFont('helvetica','bold'); pdf.setFontSize(12); pdf.setTextColor(26,115,184);
  pdf.text('REGISTRO FOTOGRÁFICO', 15, y); y += 7;

  const X = [15, 75, 135], BW = 56, BH = 42;
  FASES.forEach(([k, t], i) => {
    pdf.setFontSize(9); pdf.setTextColor(60,60,60); pdf.setFont('helvetica','bold');
    pdf.text(t.toUpperCase(), X[i], y);
    [0,1].forEach(f => {
      const iy = y + 3 + f * (BH + 5), im = fotos[k][f];
      if(im){
        const r = Math.min(BW / im.w, BH / im.h), w = im.w * r, h = im.h * r;
        pdf.addImage(im.d, 'JPEG', X[i] + (BW - w)/2, iy + (BH - h)/2, w, h);
      }else{
        pdf.setDrawColor(200,200,200); pdf.setLineWidth(.2); pdf.rect(X[i], iy, BW, BH);
        pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(150,150,150);
        pdf.text('Sin foto', X[i] + BW/2, iy + BH/2, {align:'center'});
      }
    });
  });
  y += 3 + 2 * (BH + 5) + 12;
  if(y > 262){ pdf.addPage(); y = 30; }

  pdf.setDrawColor(120,120,120); pdf.setLineWidth(.3);
  pdf.line(15, y, 85, y); pdf.line(115, y, 185, y);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(110,110,110);
  pdf.text('Firma del técnico', 15, y + 4);
  pdf.text('Vo.Bo. cliente / representante', 115, y + 4);

  const n = pdf.internal.getNumberOfPages();
  for(let p = 1; p <= n; p++){
    pdf.setPage(p); pdf.setFontSize(7); pdf.setTextColor(150,150,150);
    pdf.text(EMPRESA + ' · ' + PIE + ' · Página ' + p + ' de ' + n, 105, 288, {align:'center'});
  }
  return pdf.output('blob');
}

let dl = null;
try{ if(window.claude && claude.use) claude.use('downloads').then(m => { dl = m; }).catch(() => {}); }catch(e){}
async function descargar(blob, nombre){
  if(dl){ await dl.save({filename: nombre, data: blob}); return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
function errDescarga(e){
  if(e && e.code === 'declined') return status('Descarga cancelada.', 'info');
  status('No se pudo guardar el PDF. Intenta de nuevo.', 'err');
}

$('btnPdf').addEventListener('click', async () => {
  const d = datos(), err = validar(d);
  if(err) return status(err, 'err');
  try{
    status('Generando PDF…', 'info');
    const nombre = nombreArchivo(d);
    await descargar(crearPDF(d), nombre);
    status('PDF guardado: ' + nombre, 'ok');
  }catch(e){ errDescarga(e); }
});

$('btnWa').addEventListener('click', async () => {
  const d = datos(), err = validar(d);
  if(err) return status(err, 'err');
  try{
    status('Preparando reporte…', 'info');
    const blob = crearPDF(d), nombre = nombreArchivo(d);
    const msg = '*' + EMPRESA + '*\n*REPORTE DE SERVICIO*\n\nFecha: ' + hoy + '\nTécnico: ' + d.tecnico +
      '\nCliente: ' + d.cliente + '\nCiudad: ' + d.ciudad + '\nÁrea: ' + d.area + '\nTipo: ' + d.tipo +
      '\nObservaciones: ' + (d.obs || 'Ninguna');
    const file = new File([blob], nombre, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], text: msg}); return status('Reporte compartido', 'ok'); }
      catch(e){ if(e.name === 'AbortError') return status('Envío cancelado', 'info'); }
    }
    await descargar(blob, nombre);
    status('PDF guardado. Adjúntalo en WhatsApp.', 'info');
    try{ window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank'); }catch(e){}
  }catch(e){ errDescarga(e); }
});
</script>
